# ZooKeeper-mode lab: apache/kafka:3.7.0
#
# Official apache/kafka images default to KRaft. This compose overrides the
# entrypoint and uses the ZK configs + scripts still shipped in 3.7.0.
#
# Do not run alongside docker-compose.yml (KRaft) unless you accept the
# extra RAM use; host ports here are 29292/39292/49292 to avoid clashes.
#
# Start:  docker compose -f docker-compose.zk.yml up -d
# Stop:   docker compose -f docker-compose.zk.yml down -v

services:
  zookeeper:
    image: apache/kafka:3.7.0
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "22181:2181"
    volumes:
      - zk-data:/var/lib/kafka/data
      - ./zk/zookeeper.properties:/mnt/config/zookeeper.properties:ro
    command:
      - /opt/kafka/bin/zookeeper-server-start.sh
      - /mnt/config/zookeeper.properties
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/2181'",
        ]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 10s

  kafka-zk-1:
    image: apache/kafka:3.7.0
    hostname: kafka-zk-1
    container_name: kafka-zk-1
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "29292:9092"
    volumes:
      - kafka-zk-1-data:/var/lib/kafka/data
      - ./zk/server-1.properties:/mnt/config/server.properties:ro
    command:
      - /opt/kafka/bin/kafka-server-start.sh
      - /mnt/config/server.properties
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 30s

  kafka-zk-2:
    image: apache/kafka:3.7.0
    hostname: kafka-zk-2
    container_name: kafka-zk-2
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "39292:9092"
    volumes:
      - kafka-zk-2-data:/var/lib/kafka/data
      - ./zk/server-2.properties:/mnt/config/server.properties:ro
    command:
      - /opt/kafka/bin/kafka-server-start.sh
      - /mnt/config/server.properties
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 30s

  kafka-zk-3:
    image: apache/kafka:3.7.0
    hostname: kafka-zk-3
    container_name: kafka-zk-3
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "49292:9092"
    volumes:
      - kafka-zk-3-data:/var/lib/kafka/data
      - ./zk/server-3.properties:/mnt/config/server.properties:ro
    command:
      - /opt/kafka/bin/kafka-server-start.sh
      - /mnt/config/server.properties
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 30s

volumes:
  zk-data:
  kafka-zk-1-data:
  kafka-zk-2-data:
  kafka-zk-3-data:
